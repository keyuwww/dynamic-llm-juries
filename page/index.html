      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

flex-wrap: nowrap;gap: 0.9rem'\u003E\u003Cdiv style='flex: 1'\u003E\u003Cdiv style='flex:1 1 0;border:1px solid #e3e6ea;border-radius:10px;padding:18px 20px;background:#fafbfc;height:100%;box-sizing:border-box'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.4rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style='font-size:26px;font-weight:700;color:#1f4e79;line-height:1;font-variant-numeric:tabular-nums'\u003E01\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003ESelf-agreement routes a juror's answers better than self-solve.\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIt agrees better with the experts for all 4 jurors, by +0.074 to +0.150 in Cohen's \u03ba, with an interval above 0 for 3 of 4. Self-solve's grader missed its 0.80 bar.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cdiv style='flex:1 1 0;border:1px solid #e3e6ea;border-radius:10px;padding:18px 20px;background:#fafbfc;height:100%;box-sizing:border-box'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.4rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style='font-size:26px;font-weight:700;color:#1f4e79;line-height:1;font-variant-numeric:tabular-nums'\u003E02\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EInside a jury, the two signals tie.\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EThe agreement jury leads the self-solve jury by +0.026 (-0.020 to +0.072), short of the +0.04 set before the run.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='flex: 1'\u003E\u003Cdiv style='flex:1 1 0;border:1px solid #e3e6ea;border-radius:10px;padding:18px 20px;background:#fafbfc;height:100%;box-sizing:border-box'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.4rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cdiv style='font-size:26px;font-weight:700;color:#1f4e79;line-height:1;font-variant-numeric:tabular-nums'\u003E03\u003C/div\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe agreement jury does not beat the best single judge.\u003C/strong\u003E\u003C/span\u003E\u003C/span\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003EIts edge over gpt-oss-120b's reasoned read is +0.033 (-0.011 to +0.081), an interval that includes 0. That judge was chosen in hindsight with the expert labels.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "0e4ad93f4d85f60a34715b7b9679ff7d", "console": [], "id": "Xref", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"what-we-tested\"\u003EWhat we tested\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "435a23c209e8501b1c5b4c07d7ec7227", "console": [], "id": "SFPL", "outputs": [{"data": {"text/html": "\u003Cdiv style='border:1px solid #e3e6ea;border-radius:10px;padding:18px 22px 14px;background:#fafbfc;margin:6px 0 18px'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.75rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-experiment\"\u003EThe experiment.\u003C/h2\u003E\u003C/span\u003E\u003Cdiv style='display:flex;gap:10px;flex-wrap:wrap;max-width:820px;margin:4px 0 12px;font-family:Inter, Helvetica Neue, Helvetica, Arial, sans-serif'\u003E\u003Cdiv style='flex:1 1 0;min-width:150px;padding:12px 14px;border:1px solid #e3e6ea;border-radius:8px;background:#fff'\u003E\u003Cdiv style='font-size:11.5px;color:#666;text-transform:uppercase;letter-spacing:.04em'\u003EAnswers\u003C/div\u003E\u003Cdiv style='font-size:22px;font-weight:700;color:#1f4e79;margin:2px 0;font-variant-numeric:tabular-nums'\u003E544\u003C/div\u003E\u003Cdiv style='font-size:12.5px;color:#444;line-height:1.4'\u003E316 finance answers and 228 MT-Bench answers to 99 questions, each labelled by three experts\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='flex:1 1 0;min-width:150px;padding:12px 14px;border:1px solid #e3e6ea;border-radius:8px;background:#fff'\u003E\u003Cdiv style='font-size:11.5px;color:#666;text-transform:uppercase;letter-spacing:.04em'\u003EJurors\u003C/div\u003E\u003Cdiv style='font-size:22px;font-weight:700;color:#1f4e79;margin:2px 0;font-variant-numeric:tabular-nums'\u003E4\u003C/div\u003E\u003Cdiv style='font-size:12.5px;color:#444;line-height:1.4'\u003Eof 6 screened: gpt-oss-20b, gpt-oss-120b, qwen3.6-35b and nemotron-3-super\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='flex:1 1 0;min-width:150px;padding:12px 14px;border:1px solid #e3e6ea;border-radius:8px;background:#fff'\u003E\u003Cdiv style='font-size:11.5px;color:#666;text-transform:uppercase;letter-spacing:.04em'\u003EAnswer key\u003C/div\u003E\u003Cdiv style='font-size:22px;font-weight:700;color:#1f4e79;margin:2px 0;font-variant-numeric:tabular-nums'\u003ENone\u003C/div\u003E\u003Cdiv style='font-size:12.5px;color:#444;line-height:1.4'\u003ENo juror saw a reference answer. Agreement is Cohen\u0026#x27;s \u03ba with the experts\u0026#x27; majority label\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='flex:1 1 0;min-width:150px;padding:12px 14px;border:1px solid #e3e6ea;border-radius:8px;background:#fff'\u003E\u003Cdiv style='font-size:11.5px;color:#666;text-transform:uppercase;letter-spacing:.04em'\u003ERerun noise\u003C/div\u003E\u003Cdiv style='font-size:22px;font-weight:700;color:#1f4e79;margin:2px 0;font-variant-numeric:tabular-nums'\u003E1 of 40\u003C/div\u003E\u003Cdiv style='font-size:12.5px;color:#444;line-height:1.4'\u003Eagreement jury verdicts changed when the first answers were read a second time\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='max-width:760px;margin:4px 0 8px;font-family:Inter, Helvetica Neue, Helvetica, Arial, sans-serif'\u003E\u003Cdiv style='border:1px solid #e3e6ea;border-radius:8px;overflow:hidden'\u003E\u003Ctable style='width:100%;border-collapse:collapse;background:#fff'\u003E\u003Ctbody\u003E\u003Ctr style=''\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid transparent'\u003EGut read\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EOne token and no reasoning: whether INCORRECT or CORRECT is more likely right after \u0026quot;VERDICT:\u0026quot;\u003C/td\u003E\u003C/tr\u003E\u003Ctr style=''\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid transparent'\u003EReasoned read\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EThe juror reasons first, then writes CORRECT or INCORRECT\u003C/td\u003E\u003C/tr\u003E\u003Ctr\u003E\u003Ctd colspan='2' style='padding:6px 14px 2px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6c757d;background:#f1f4f8;border-left:3px solid #1f4e79'\u003EThe trust signal we test\u003C/td\u003E\u003C/tr\u003E\u003Ctr style='background:#f1f4f8'\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid #1f4e79'\u003EAgrees with itself\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EIts gut read and its reasoned read give the same verdict. This needs no answer key\u003C/td\u003E\u003C/tr\u003E\u003Ctr style=''\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid transparent'\u003EConflict\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EHow strongly its gut read leans against its reasoned verdict. A low conflict means the gut read firmly backs that verdict\u003C/td\u003E\u003C/tr\u003E\u003Ctr style=''\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid transparent'\u003ESolved the question\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EThe juror answered the question itself, and a grader that saw the expert reference called its answer correct. Kensho\u0026#x27;s paper No Free Labels trusts a judge only on the questions it can solve\u003C/td\u003E\u003C/tr\u003E\u003C/tbody\u003E\u003C/table\u003E\u003C/div\u003E\u003C/div\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EEach juror graded every answer twice, and we asked which jurors to trust on each one.\u003C/strong\u003E Without an answer key, a juror can check itself only against itself. So we compared trusting jurors whose two reads agree with trusting jurors that could solve the question.\u003C/span\u003E\u003C/span\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "d31c063a2bbd91e7e96fd8e204c131f0", "console": [], "id": "BYtC", "outputs": [{"data": {"text/html": "\u003Cdiv style='border:1px solid #e3e6ea;border-radius:10px;padding:18px 22px 14px;background:#fafbfc;margin:6px 0 18px'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.75rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"the-juries-and-the-rules-we-set-before-the-run\"\u003EThe juries, and the rules we set before the run.\u003C/h2\u003E\u003C/span\u003E\u003Cdiv style='max-width:760px;margin:4px 0 8px;font-family:Inter, Helvetica Neue, Helvetica, Arial, sans-serif'\u003E\u003Cdiv style='border:1px solid #e3e6ea;border-radius:8px;overflow:hidden'\u003E\u003Ctable style='width:100%;border-collapse:collapse;background:#fff'\u003E\u003Ctbody\u003E\u003Ctr\u003E\u003Ctd colspan='2' style='padding:6px 14px 2px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#6c757d;background:#f1f4f8;border-left:3px solid #1f4e79'\u003EThe jury we test\u003C/td\u003E\u003C/tr\u003E\u003Ctr style='background:#f1f4f8'\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid #1f4e79'\u003EAgreement jury\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EOnly jurors that agree with themselves vote, with their reasoned verdicts\u003C/td\u003E\u003C/tr\u003E\u003Ctr style=''\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid transparent'\u003ESelf-solve jury\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EOnly jurors that solved the question vote, with their reasoned verdicts\u003C/td\u003E\u003C/tr\u003E\u003Ctr style=''\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid transparent'\u003EMajority of four\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003EEvery juror\u0026#x27;s reasoned verdict votes, and a tie counts as a reject. The gut majority is the same vote over the gut reads\u003C/td\u003E\u003C/tr\u003E\u003Ctr style=''\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;width:34%;font-weight:600;color:#1f4e79;white-space:nowrap;border-left:3px solid transparent'\u003EBest single judge\u003C/td\u003E\u003Ctd style='padding:9px 14px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:14px;line-height:1.45;color:#333'\u003Egpt-oss-120b\u0026#x27;s reasoned read, the best of the 8 single reads, chosen in hindsight with the expert labels\u003C/td\u003E\u003C/tr\u003E\u003C/tbody\u003E\u003C/table\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='font-style:italic;font-size:13.5px;line-height:1.55;color:#555;max-width:820px;margin:2px 0 6px'\u003EWhen no juror qualifies, a jury falls back on the majority of four. A tie goes to the voter whose gut read is most confident, and a missing verdict counts as a reject. A juror with no reasoned verdict never counts as agreeing with itself.\u003C/div\u003E\u003Cdiv style='max-width:820px;margin:4px 0 12px;font-family:Inter, Helvetica Neue, Helvetica, Arial, sans-serif'\u003E\u003Cdiv style='border:1px solid #e3e6ea;border-radius:8px;overflow:hidden'\u003E\u003Ctable style='width:100%;border-collapse:collapse;background:#fff'\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth style='padding:8px 12px;text-align:left;font-size:11.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #1f4e79;background:#f8f9fa'\u003ERule\u003C/th\u003E\u003Cth style='padding:8px 12px;text-align:left;font-size:11.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #1f4e79;background:#f8f9fa'\u003EWhat it needs\u003C/th\u003E\u003Cth style='padding:8px 12px;text-align:right;font-size:11.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #1f4e79;background:#f8f9fa'\u003EResult\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E\u003Ctr\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;font-weight:600;color:#1f4e79;white-space:nowrap'\u003ERule 1: agreement against self-solve\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003EThe agreement jury wins at +0.04 or more over the self-solve jury, with its interval above 0. The self-solve jury wins at -0.04 or less, with its interval below 0. Anything else is a tie\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;text-align:right;font-variant-numeric:tabular-nums;color:#333'\u003Etie\u003C/td\u003E\u003C/tr\u003E\u003Ctr\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;font-weight:600;color:#1f4e79;white-space:nowrap'\u003ERule 2: the jury wins\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003EThe agreement jury beats the best single judge by +0.03 or more, with its interval above 0, and is at least the majority of four\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;text-align:right;font-variant-numeric:tabular-nums;color:#333'\u003Enot met\u003C/td\u003E\u003C/tr\u003E\u003Ctr\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;font-weight:600;color:#1f4e79;white-space:nowrap'\u003ESelf-solve gap test\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003EHolds if self-agreement ranks a juror\u0026#x27;s errors on questions it could not solve at an AUROC of 0.65 or more, lower bound 0.55. Vanishes at 0.60 or less with solved minus unsolved at +0.10 or more\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;text-align:right;font-variant-numeric:tabular-nums;color:#333'\u003Ein between\u003C/td\u003E\u003C/tr\u003E\u003C/tbody\u003E\u003C/table\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='font-style:italic;font-size:13.5px;line-height:1.55;color:#555;max-width:820px;margin:2px 0 6px'\u003EAUROC is the chance that a score ranks an error above a correct verdict, where 0.5 is chance. Differences in \u03ba below 0.03 are not read as real. The three-juror jury, closest to the planned design, and a five-juror jury with gpt-oss-safeguard-20b reach the same outcomes on both rules. The plan is not in this folder, but results/decisions.csv quotes each rule.\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}, {"code_hash": "f31c9e69c5e27e03e3675c44927c8f67", "console": [], "id": "RGSE", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"which-answers-to-trust\"\u003EWhich answers to trust\u003C/h1\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "07f2f9546f42d2a4f1bce72fc32c4aae", "console": [], "id": "Kclp", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "f75727f5cb9d301e6a7894bce35181b7", "console": [], "id": "emfo", "outputs": [{"data": {"text/html": "\u003Cdiv style='border:1px solid #e3e6ea;border-radius:10px;padding:18px 22px 14px;background:#fafbfc;margin:6px 0 18px'\u003E\u003Cdiv style='display: flex;flex: 1;flex-direction: column;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 0.75rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"which-signal-should-route-a-judges-answers\"\u003EWhich signal should route a judge's answers?\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003ERouting means choosing which of a juror's answers to trust. Each juror keeps as many answers as it solved, chosen two ways. Grey keeps the answers on questions it solved, navy the ones with the least conflict between its two reads. The dark tick is the 95th percentile of random draws of the same size.\u003C/span\u003E\u003C/span\u003E\u003Cmarimo-mime-renderer data-mime='\u0026quot;application/vnd.vegalite.v6+json\u0026quot;' data-data='\u0026quot;{\u0026#92;n  \u0026#92;\u0026quot;\u0026#36;schema\u0026#92;\u0026quot;: \u0026#92;\u0026quot;https://vega.github.io/schema/vega-lite/v6.4.1.json\u0026#92;\u0026quot;,\u0026#92;n  \u0026#92;\u0026quot;config\u0026#92;\u0026quot;: {\u0026#92;n    \u0026#92;\u0026q ;flex-wrap: nowrap;gap: 0.75rem'\u003E\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"what-follows\"\u003EWhat follows.\u003C/h2\u003E\u003C/span\u003E\u003Cdiv style='max-width:820px;margin:4px 0 12px;font-family:Inter, Helvetica Neue, Helvetica, Arial, sans-serif'\u003E\u003Cdiv style='border:1px solid #e3e6ea;border-radius:8px;overflow:hidden'\u003E\u003Ctable style='width:100%;border-collapse:collapse;background:#fff'\u003E\u003Cthead\u003E\u003Ctr\u003E\u003Cth style='padding:8px 12px;text-align:left;font-size:11.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #1f4e79;background:#f8f9fa'\u003EFinding\u003C/th\u003E\u003Cth style='padding:8px 12px;text-align:left;font-size:11.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #1f4e79;background:#f8f9fa'\u003EWhat it means\u003C/th\u003E\u003Cth style='padding:8px 12px;text-align:left;font-size:11.5px;font-weight:600;color:#666;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #1f4e79;background:#f8f9fa'\u003EWhat to do\u003C/th\u003E\u003C/tr\u003E\u003C/thead\u003E\u003Ctbody\u003E\u003Ctr\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;font-weight:600;color:#1f4e79;white-space:nowrap'\u003ESelf-agreement routes better than self-solve\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003EIt scores higher for all 4 jurors, by +0.074 to +0.150 in \u03ba, and needs no answer key, but no decision rule was set for it before the run\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003ETest it with a rule set in advance and a grader that meets its bar\u003C/td\u003E\u003C/tr\u003E\u003Ctr\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;font-weight:600;color:#1f4e79;white-space:nowrap'\u003EThe agreement jury does not beat the best single judge\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003EIt adds +0.033 over gpt-oss-120b\u0026#x27;s reasoned read, chosen with the expert labels, and the interval includes 0\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003ETest a larger or more varied jury before relying on four judges over one\u003C/td\u003E\u003C/tr\u003E\u003Ctr\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;font-weight:600;color:#1f4e79;white-space:nowrap'\u003ENo juror vouches for some answers\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003EOn 4.0% of answers every fallback is weak\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003ESend those answers to a person, untested here, which keeps 96% automatic\u003C/td\u003E\u003C/tr\u003E\u003Ctr\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;font-weight:600;color:#1f4e79;white-space:nowrap'\u003EMore jurors agree, closer to the experts\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003E\u03ba runs from 0.18 with no juror agreeing with itself to 0.80 with all four. The grouping has no interval and was not a test set before the run\u003C/td\u003E\u003Ctd style='padding:8px 12px;border-bottom:1px solid #e9ecef;vertical-align:top;font-size:13.5px;line-height:1.4;color:#333'\u003ETest the count as an order for a person\u0026#x27;s review, against the summed gut margin, which ranked errors as well post hoc\u003C/td\u003E\u003C/tr\u003E\u003C/tbody\u003E\u003C/table\u003E\u003C/div\u003E\u003C/div\u003E\u003Cdiv style='font-style:italic;font-size:13.5px;line-height:1.55;color:#555;max-width:820px;margin:2px 0 6px'\u003EStill open: does it hold with a grader that meets the bar, with jurors from more model families, and on questions beyond finance and math?\u003C/div\u003E\u003C/div\u003E\u003C/div\u003E"}, "type": "data"}]}], "metadata": {"marimo_version": "0.24.2", "script_metadata_hash": null}, "version": "1"},
